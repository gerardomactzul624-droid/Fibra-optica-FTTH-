
     <h1> Fibra Optica FTTH</h1>
        <p>FTTH (por sus siglas en inglés, Fiber to the Home, o fibra hasta el hogar) es una tecnología de telecomunicaciones que lleva un cable de fibra óptica puro y directo desde la central de la compañía de internet hasta el interior de tu casa o negocio, sin usar cables de cobre.</p>
